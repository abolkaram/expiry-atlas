<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Expiry Atlas</title><style>*{box-sizing:border-box}body{margin:0;background:#f3ead6;color:#241c14;font:16px Arial}button,input,textarea{font:inherit}header{display:flex;justify-content:space-between;padding:18px 4vw;border-bottom:2px solid}.atlas{min-height:100vh;position:relative;padding:7vh 5vw;background:linear-gradient(90deg,transparent 49.8%,#d64b35 50%,transparent 50.2%),repeating-linear-gradient(0deg,transparent 0 79px,#241c1420 80px),repeating-linear-gradient(90deg,transparent 0 119px,#241c1420 120px)}.atlas h1{font:900 clamp(4rem,12vw,11rem)/.75 Arial Black;margin:0;letter-spacing:-.08em}.stamp{position:absolute;right:8vw;top:20vh;width:260px;height:260px;border:12px double #164e68;border-radius:50%;display:grid;place-items:center;text-align:center;transform:rotate(12deg);font:900 1rem monospace;color:#164e68}.meridian{position:absolute;left:50%;top:0;bottom:0;width:5px;background:#d64b35;box-shadow:0 0 20px #d64b35}.controls{position:absolute;bottom:6vh;display:flex;gap:8px;flex-wrap:wrap}.controls button{background:#241c14;color:white;border:0;padding:12px}.record{padding:7vh 5vw;background:#164e68;color:white}.reader{display:flex}.reader input{flex:1;padding:11px}.status{font:12px monospace;color:#ffd06e}pre{white-space:pre-wrap;background:#0b3549;padding:18px}.sheet{position:fixed;z-index:4;inset:5vh 5vw;background:#fffaf0;padding:30px;transform:rotateX(90deg);transform-origin:bottom;transition:.35s;overflow:auto}.sheet.open{transform:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.wide{grid-column:1/-1}.field input,.field textarea{padding:10px;border:0;border-bottom:2px solid}.seal{background:#d64b35;color:white;border:0;padding:13px;margin-top:15px}.close{float:right}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.stamp{position:static;margin:60px auto}.meridian{left:80%}}</style></head><body><header><b>EXPIRY ATLAS / RENEWAL MERIDIAN</b><button id="connect">CONNECT</button></header><main class="atlas" id="atlas"><div class="meridian" id="meridian"></div><h1>TIME HAS<br>A BORDER.</h1><div class="stamp">AUTHORITY<br>BOUND<br>PERMIT</div><div class="controls"><button id="registerOpen">STAMP A PERMIT</button><button id="renewalOpen">OPEN RENEWAL</button><button id="renewOpen">VERIFY RENEWAL</button><button id="expire">MARK EXPIRED</button></div></main><section class="record"><div class="reader"><input id="active" placeholder="Permit ID"><button id="read">LOCATE</button></div><p id="status" class="status">DEPLOYMENT PENDING REVIEW</p><pre id="output">No permit located.</pre></section><section class="sheet" id="registerSheet"><button class="close">×</button><h2>Stamp the original coordinates.</h2><form id="registerForm"><div class="grid"><div class="field"><label>ID</label><input id="id" required></div><div class="field"><label>HOLDER</label><input id="holder" required></div><div class="field"><label>NAME</label><input id="name" required></div><div class="field"><label>EXPIRY TIMESTAMP</label><input id="expiry" type="number" required></div><div class="field"><label>RENEWAL WINDOW</label><input id="window" type="number" value="604800"></div><div class="field wide"><label>SCOPE</label><textarea id="scope" required></textarea></div><div class="field wide"><label>CONDITIONS / ONE PER LINE</label><textarea id="conditions" required></textarea></div><details class="field wide"><summary>FREEZE AUTHORITY ORIGIN</summary><input id="authority" type="url" required></details></div><button class="seal">REGISTER</button></form></section><section class="sheet" id="renewSheet"><button class="close">×</button><h2>Cross the renewal meridian.</h2><form id="renewForm"><div class="grid"><div class="field"><label>NEW EXPIRY</label><input id="newExpiry" type="number" required></div><details class="field"><summary>AUTHORITY RENEWAL RECORD</summary><input id="renewal" type="url" required></details></div><button class="seal">RENEW</button></form></section><script type="module">import{createClient}from'https://esm.sh/genlayer-js@1.1.8';import{studionet}from'https://esm.sh/genlayer-js@1.1.8/chains';const $=s=>document.querySelector(s),ADDRESS='CONTRACT_ADDRESS';let client;const open=id=>$(id).classList.add('open'),close=()=>document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('open')),status=t=>$('#status').textContent=t;async function connect(){const[a]=await ethereum.request({method:'eth_requestAccounts'});client=createClient({chain:studionet,account:a,provider:ethereum});await client.connect('studionet')}async function read(){if(!client)await connect();const x=await client.readContract({address:ADDRESS,functionName:'get_permit',args:[$('#active').value]});$('#output').textContent=JSON.stringify(x,(_,v)=>typeof v==='bigint'?v.toString():v,2)}async function write(fn,args){if(!client)await connect();const h=await client.writeContract({address:ADDRESS,functionName:fn,args,value:0n});status('WAITING FINALIZED');await client.waitForTransactionReceipt({hash:h,status:'FINALIZED',retries:180,interval:5000});status('FINALIZED '+h);await read()}$('#connect').onclick=connect;$('#registerOpen').onclick=()=>open('#registerSheet');$('#renewOpen').onclick=()=>write('open_renewal',[$('#active').value]);$('#renewalOpen').onclick=()=>write('open_renewal',[$('#active').value]);$('#renewOpen').onclick=()=>open('#renewSheet');document.querySelectorAll('.close').forEach(b=>b.onclick=close);$('#registerForm').onsubmit=e=>{e.preventDefault();$('#active').value=$('#id').value;write('register',[$('#id').value,$('#holder').value,$('#name').value,$('#scope').value,$('#authority').value,$('#conditions').value.split('\n').filter(Boolean),Number($('#expiry').value),Number($('#window').value)]).then(close)};$('#renewForm').onsubmit=e=>{e.preventDefault();write('renew',[$('#active').value,$('#renewal').value,Number($('#newExpiry').value)]).then(close)};$('#expire').onclick=()=>write('expire',[$('#active').value]);$('#read').onclick=read;</script></body></html>
